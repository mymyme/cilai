[package]
name = "cilai-host-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 版本与现有宿主逐一对齐：被引用的模块是同一份源码，依赖版本不同会引入行为差异。
[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.44", default-features = false, features = ["clock", "std"] }
contexthub-local-transport = { path = "../../../crates/local-transport", version = "=0.1.0" }
contexthub-platform-adapter = { path = "../../../crates/platform-adapter", version = "=0.1.0" }
contexthub-protocol = { path = "../../../crates/protocol", version = "=0.1.0" }
contexthub-workbench-runtime = { path = "../../../crates/workbench-runtime", version = "=0.1.0" }
ed25519-dalek = "=2.2.0"
regex = "=1.13.1"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
trash = "=5.2.3"
tokio = { version = "=1.53.1", features = ["io-util", "net", "process", "sync", "time"] }
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["v4"] }
zip = { version = "=9.0.4", default-features = false, features = ["deflate"] }

[lints]
workspace = true
