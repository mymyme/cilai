<!doctype html>
<meta charset="utf-8">
<title>webview 承载验证</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0f14; font: 13px -apple-system, sans-serif; color: #e6edf3; }
  #bar { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #11161d; }
  #bar b { font-weight: 600; }
  #stage { position: relative; width: 1132px; height: 680px; margin: 12px 16px; }
  webview { position: absolute; inset: 0; width: 100%; height: 100%; }
  /*
   * 宿主浮层：验证宿主 DOM 能否盖在业务应用之上。当年否掉原生子视图正是卡在这里，
   * 圆角与半透明一并验，因为浮层机制依赖的是完整合成而不只是遮挡。
   */
  #overlay {
    position: absolute; left: 80px; top: 60px; width: 320px; height: 160px;
    background: rgb(220 38 38 / 92%); border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; box-shadow: 0 12px 32px rgb(0 0 0 / 45%);
  }
  #overlay[hidden] { display: none; }
</style>
<div id="bar">
  <b>环保档案</b>
  <span id="state">加载中…</span>
  <button id="toggle">切换宿主浮层</button>
  <button id="loadApp">加载环保档案</button>
  <button id="loadControls">加载控件自检页</button>
</div>
<div id="stage">
  <webview id="wv" partition="persist:spike-archive"></webview>
  <div id="overlay">宿主浮层盖在应用之上</div>
</div>
<script>
  const wv = document.getElementById("wv");
  const state = document.getElementById("state");
  const overlay = document.getElementById("overlay");
  document.getElementById("toggle").addEventListener("click", () => { overlay.hidden = !overlay.hidden; });
  const go = (url) => { window.ready = false; state.textContent = "加载中…"; document.getElementById("wv").src = url; };
  document.getElementById("loadApp").addEventListener("click", () => go("https://archive.cilai.com.cn/"));
  document.getElementById("loadControls").addEventListener("click", () => go("webview-controls.html"));
  window.ready = false;
  wv.addEventListener("did-finish-load", () => { window.ready = true; state.textContent = "已加载 " + wv.getURL(); });
  wv.addEventListener("did-fail-load", (e) => { state.textContent = "加载失败 " + e.errorDescription; });
</script>
