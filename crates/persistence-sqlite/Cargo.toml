[package]
name = "contexthub-persistence-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
contexthub-application = { path = "../application", version = "=0.1.1" }
contexthub-domain = { path = "../domain", version = "=0.1.1" }
contexthub-protocol = { path = "../protocol", version = "=0.1.1" }
contexthub-manifest = { path = "../manifest", version = "=0.1.1" }
contexthub-platform-adapter = { path = "../platform-adapter", version = "=0.1.1" }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sha2 = "=0.10.9"
serde_json = "=1.0.151"
uuid = { version = "=1.24.0", features = ["v4"] }

[dev-dependencies]
contexthub-workspace-fs = { path = "../workspace-fs", version = "=0.1.1" }

[lints]
workspace = true
