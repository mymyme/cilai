[package]
name = "contexthub-platform-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
contexthub-local-transport = { path = "../local-transport", version = "=0.1.1" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
ring = "=0.17.14"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSURL", "NSFileManager", "NSError", "NSPathUtilities"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_Security_Authentication_Identity",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_Storage_CloudFilters",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_SystemServices",
  "Win32_System_StationsAndDesktops",
  "Win32_System_WindowsProgramming",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
